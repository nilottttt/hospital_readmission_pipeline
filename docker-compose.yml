# Hospital Readmission Pipeline - local stack
#   postgres          : PostgreSQL 16 (Airflow metadata DB + healthcare DB)
#   airflow-init      : one-off job that prepares Airflow's DB and admin user
#   airflow-webserver : Airflow UI  -> http://localhost:8080
#   airflow-scheduler : runs the DAG tasks
#   dashboard         : Streamlit   -> http://localhost:8501
#   mlflow            : MLflow tracking server + model registry -> http://localhost:5000   (Part 2)
#   api               : FastAPI inference service               -> http://localhost:8000/docs (Part 2)
#
# Start everything:   docker compose up -d --build
# Stop everything:    docker compose down
# Wipe DB as well:    docker compose down -v

x-airflow-common: &airflow-common
  build: ./docker/airflow
  image: hrp-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Our project code (etl package) is importable from the DAG
    PYTHONPATH: /opt/airflow
    # Settings read by etl/config.py
    HC_DB_HOST: postgres
    HC_DB_PORT: "5432"
    HC_DB_USER: ${POSTGRES_USER}
    HC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    DATA_DIR: /opt/airflow/data
    SQL_DIR: /opt/airflow/sql
    # Part 2
    MLFLOW_TRACKING_URI: http://mlflow:5000
    API_URL: http://api:8000
    GIT_PYTHON_REFRESH: quiet
    NUMBA_CACHE_DIR: /tmp/numba_cache
    MPLCONFIGDIR: /tmp/matplotlib
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./ml:/opt/airflow/ml
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build: ./docker/streamlit
    image: hrp-dashboard:latest
    env_file: .env
    environment:
      HC_DB_HOST: postgres
      HC_DB_PORT: "5432"
      HC_DB_USER: ${POSTGRES_USER}
      HC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_URL: http://api:8000
      MLFLOW_UI_URL: http://localhost:5000
    volumes:
      - ./dashboard:/app/dashboard
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------- Part 2: MLOps
  mlflow:
    build: ./docker/mlflow
    image: hrp-mlflow:2.22.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: hrp-api:latest
    env_file: .env
    environment:
      HC_DB_HOST: postgres
      HC_DB_PORT: "5432"
      HC_DB_USER: ${POSTGRES_USER}
      HC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mlflow_data:
